blank_issues_enabled: false
issue_templates:
  - name: "Bug Report"
    description: "Report a bug in the system."
    title: "[Bug]: "
    labels: ["bug"]
    body: "./ISSUE_TEMPLATE/bug_report.md"
  - name: "Feature Request"
    description: "Propose a new feature or improvement."
    title: "[Feature]: "
    labels: ["enhancement"]
    body: "./ISSUE_TEMPLATE/feature_request.md"
  - name: "Documentation"
    description: "Suggest updates or additions to the documentation."
    title: "[Docs]: "
    labels: ["documentation"]
    body: "./ISSUE_TEMPLATE/documentation_change.md"
  - name: "General Report"
    description: "Provide general feedback or inquiries."
    title: "[General]: "
    labels: ["general"]
    body: "./ISSUE_TEMPLATE/general_report.md"
  - name: "Changes with moderate external impact"
    description: "Describe or request changes that affect multiple repositories or include multiple Issues or PRs in a single repo, or will benefit from coordination between developers."
    title: "[MediumChange]: "
    labels: []
    body: "./ISSUE_TEMPLATE/medium_impact_radius.md"
  - name: "Changes with large external impact"
    description: "Describe or request modifications that change software or user interfaces, change the way that users run the system, or change underlying system behavior."
    title: "[LargeChange]: "
    labels: []
    body: "./ISSUE_TEMPLATE/large_impact_radius.md"
